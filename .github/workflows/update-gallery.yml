name: Auto Update Photo Gallery Manifest

on:
  push:
    paths:
      - 'images/photography/**'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install Pillow pillow-heif

      - name: Process photos, HEIC conversion & EXIF
        run: python update_gallery.py

      - name: Commit & push updated photos and json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: convert HEIC photos & update gallery manifest"
          file_pattern: 'images/photography/*'
